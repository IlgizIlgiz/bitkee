[package]
name = "bitkee-cli"
version = "0.1.0"
edition = "2021"
authors = ["BitKee"]
description = "Native CLI Bitcoin puzzle solver — многопоточный поиск приватных ключей"

[[bin]]
name = "bitkee"
path = "src/main.rs"

[dependencies]
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
ripemd = "0.1"
bs58 = "0.5"
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
num_cpus = "1"
ctrlc = "3"
atty = "0.2"

[profile.release]
opt-level = 3
lto = true
